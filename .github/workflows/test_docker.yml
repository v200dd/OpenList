name: Beta Release (Docker)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHCR_ORG_NAME: v200dd
  IMAGE_NAME: openlist-git
  IMAGE_NAME_DOCKERHUB: openlist
  REGISTRY: ghcr.io
  ARTIFACT_NAME: 'binaries_docker_release'
  RELEASE_PLATFORMS: 'linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/arm/v6,linux/ppc64le,linux/riscv64,linux/loong64' ### Temporarily disable Docker builds for linux/s390x architectures for unknown reasons.
  IMAGE_PUSH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
  IMAGE_TAGS_BETA: |
    type=ref,event=pr
    type=raw,value=beta,enable={{is_default_branch}}
    type=raw,value=beta-${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Check published frontend
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.frontend.outputs.should_build }}
      frontend_url: ${{ steps.frontend.outputs.frontend_url }}
      frontend_sha256: ${{ steps.frontend.outputs.frontend_sha256 }}
      frontend_version: ${{ steps.frontend.outputs.frontend_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin frontend and check image freshness
        id: frontend
        run: python3 .github/scripts/docker_frontend.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}
          DOCKER_IMAGE: ${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
      - name: Test frontend freshness and offline installer
        run: |
          python3 tests/docker_frontend_test.py
          bash tests/docker_v3_test.sh

  build_binary:
    needs: frontend
    if: needs.frontend.outputs.should_build == 'true'
    name: Build Binaries for Docker Release (Beta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Cache Musl
        id: cache-musl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/musl-libs
          key: docker-musl-libs-v2

      - name: Download Musl Library
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: bash build.sh prepare docker-multiplatform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build go binary (beta)
        run: bash build.sh beta docker-multiplatform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}
          FRONTEND_ARCHIVE_URL: ${{ needs.frontend.outputs.frontend_url }}
          FRONTEND_ARCHIVE_SHA256: ${{ needs.frontend.outputs.frontend_sha256 }}
          FRONTEND_VERSION: ${{ needs.frontend.outputs.frontend_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            build/
            !build/*.tgz
            !build/musl-libs/**

  release_docker:
    needs: [frontend, build_binary]
    name: Release Docker image (Beta)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: ["latest", "ffmpeg", "aria2", "aio"]
        include:
          - image: "latest"
            base_image_tag: "base"
            build_arg: ""
            tag_favor: ""
          - image: "ffmpeg"
            base_image_tag: "ffmpeg"
            build_arg: INSTALL_FFMPEG=true
            tag_favor: "suffix=-ffmpeg,onlatest=true"
          - image: "aria2"
            base_image_tag: "aria2"
            build_arg: INSTALL_ARIA2=true
            tag_favor: "suffix=-aria2,onlatest=true"
          - image: "aio"
            base_image_tag: "aio"
            build_arg: |
              INSTALL_FFMPEG=true
              INSTALL_ARIA2=true
            tag_favor: "suffix=-aio,onlatest=true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 'build/'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: env.IMAGE_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.GHCR_ORG_NAME }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS_BETA }}
          flavor: |
            ${{ matrix.tag_favor }}
          labels: |
            org.opencontainers.image.frontend.version=${{ needs.frontend.outputs.frontend_version }}
            org.opencontainers.image.frontend.sha256=${{ needs.frontend.outputs.frontend_sha256 }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.ci
          push: ${{ env.IMAGE_PUSH == 'true' }}
          build-args: |
            BASE_IMAGE_TAG=${{ matrix.base_image_tag }}
            ${{ matrix.build_arg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.RELEASE_PLATFORMS }}

  export_images:
    name: Verify and export Docker image (${{ matrix.arch }})
    needs: [frontend, release_docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image and export offline package
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
          FRONTEND_VERSION: ${{ needs.frontend.outputs.frontend_version }}
          FRONTEND_SHA256: ${{ needs.frontend.outputs.frontend_sha256 }}
        run: |
          set -euo pipefail
          source="ghcr.io/${GHCR_ORG_NAME}/${IMAGE_NAME}:beta-${REVISION}"
          docker pull --platform "linux/${ARCH}" "$source"
          actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$source")"
          actual_frontend="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.frontend.sha256"}}' "$source")"
          test "$actual_revision" = "$REVISION"
          test "$actual_frontend" = "$FRONTEND_SHA256"
          docker run --rm --platform "linux/${ARCH}" "$source" /entrypoint.sh version | tee version.txt
          grep -F "$FRONTEND_VERSION" version.txt
          container="$(docker run -d --rm --platform "linux/${ARCH}" --tmpfs /opt/openlist/data:rw,uid=1001,gid=1001 -e UMASK=022 -p 127.0.0.1::5244 "$source")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          address="$(docker port "$container" 5244/tcp | head -n 1)"
          python3 .github/scripts/docker_smoke.py "http://${address}"
          canonical="ghcr.io/${GHCR_ORG_NAME}/${IMAGE_NAME}:beta"
          mirror="ghcr.nju.edu.cn/${GHCR_ORG_NAME}/${IMAGE_NAME}:beta"
          local="${GHCR_ORG_NAME}/${IMAGE_NAME}:beta"
          docker tag "$source" "$canonical"
          docker tag "$source" "$mirror"
          docker tag "$source" "$local"
          mkdir -p exports
          package="openlist-docker-beta-${ARCH}.tar.gz"
          docker save "$canonical" "$mirror" "$local" | gzip -1 > "exports/$package"
          (cd exports && sha256sum "$package" > "$package.sha256")
          docker load --input "exports/$package"
      - name: Upload offline packages to beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload beta exports/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload offline packages as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-image-${{ matrix.arch }}
          path: exports/*
          compression-level: 0
